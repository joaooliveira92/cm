# Match commentary
#
# Every line of match commentary comes from this file. Edit it to change what the commentator says;
# the game reads it again when it changes, so edits show from the next lines of a match in play.
# It is plain text in UTF-8. A line starting with # is a comment.
#
# [Section]         one moment of a match. Each section is a pool of lines; the game picks one at
#                   random and doesn't repeat a line until it has used the whole pool.
# delay = 1400      how long the line stays up, in milliseconds, before the next one.
# flash = yes       the line blinks in the commentary bar.
# chance = 60       the percentage of the time the line shows in the commentary bar at all. Only for
#                   minor moments: lines that change the match (goals, cards, injuries,
#                   substitutions, penalties, half and full time) always show.
#
# Any other line is one thing the commentator can say. Placeholders in braces are filled in:
#
#   {player}        the player the moment is about
#   {player2}       a second player, where the section says so
#   {team}          the club the moment is about
#   {team2}         the other club
#
# and, where a section lists them, {score}, {injury}, {side} and {formation}. A line using a
# placeholder its section doesn't list is skipped.
#
# A | splits a line into parts that appear one after another, like "{player} shoots…|saved!". The
# first part holds for a moment before the line goes on. Players are "he"; a club is plural
# ("{team} are"); avoid "{team}'s", which reads badly for clubs ending in s.
#
# A section missing from this file, or left with no usable lines, uses the game's own lines. Delete
# this file to get the game's lines back; it is written again at the next match.


# Match commentary
#
# Every line of match commentary comes from this file. Edit it to change what the commentator says;
# the game reads it again when it changes, so edits show from the next lines of a match in play.
# It is plain text in UTF-8. A line starting with # is a comment.
#
# [Section]         one moment of a match. Each section is a pool of lines; the game picks one at
#                   random and doesn't repeat a line until it has used the whole pool.
# delay = 1400      how long the line stays up, in milliseconds, before the next one.
# flash = yes       the line blinks in the commentary bar.
# chance = 60       the percentage of the time the line shows in the commentary bar at all. Only for
#                   minor moments: lines that change the match (goals, cards, injuries,
#                   substitutions, penalties, half and full time) always show.
# level = extended  how important the moment is: key, extended or full. A player watching Key
#                   highlights sees only key lines in the commentary bar, Extended adds extended
#                   lines, Full shows everything. Lines below the player's level still appear in the
#                   log. Moments that change the match are always key.
#
# Any other line is one thing the commentator can say. Placeholders in braces are filled in:
#
#   {player}        the player the moment is about
#   {player2}       a second player, where the section says so
#   {team}          the club the moment is about
#   {team2}         the other club
#
# and, where a section lists them, {score}, {injury}, {side}, {formation} and {assist} (the player who
# set up a shot: a corner's taker, or the creator of an attack). A line using a
# placeholder its section doesn't list is skipped. The words {score}, {injury} and {side} put in come
# from the [Phrases] section below.
#
# A | splits a line into parts that appear one after another, like "{player} shoots…|saved!". The
# first part holds for a moment before the line goes on.
#
# For the player's pronouns write {he}, {him} and {his} ({He} and {His} to start a sentence), never a
# bare "he": the game fills them for each player. A club is plural ("{team} are"); avoid "{team}'s",
# which reads badly for clubs ending in s.
#
# A section missing from this file, or left with no usable lines, uses the game's own lines. Delete
# this file to get the game's lines back; it is written again at the next match.
#
# The version line below says which release of the game's lines this file started from. When the
# game ships a newer one with sections this file doesn't have, Preferences offers to add them; your
# own sections are never changed.

version = 3

[Phrases]
# The words the game builds placeholders from. Translate these along with the lines. One phrase per
# line, written name = text.
#   injury.<type>  what {injury} says for each kind of injury
#   score          what {score} says: {home} and {away} are the clubs, {homeScore} and {awayScore}
#                  their goals
#   side.left, side.right  what {side} says for a corner or free kick
injury.brokenToe = a broken toe
injury.twistedAnkle = a twisted ankle
injury.deadLeg = a dead leg
injury.hamstring = a hamstring problem
injury.calf = a calf problem
injury.strain = a muscle strain
score = {home} {homeScore}-{awayScore} {away}
side.left = left
side.right = right

